# TechBuilding Render Blueprint
#
# This file creates the complete demo stack on Render:
#   - techbuilding-frontend: React/Vite static site
#   - techbuilding-api: Spring Boot API built from Backend/demoTechBuildding/Dockerfile
#   - techbuilding-mysql: MySQL 8 private service with persistent storage
#   - techbuilding-redis: Redis-compatible Render Key Value instance
#   - techbuilding-minio: public S3-compatible object storage with persistent storage
#
# The Blueprint wires service URLs and generated credentials through Render's
# private network. Do not put real credentials in this file.

services:
  # MySQL is kept private; only the API connects to it over Render's network.
  - type: pserv
    name: techbuilding-mysql
    runtime: image
    image:
      url: mysql:8.0.35
    plan: starter
    region: singapore
    numInstances: 1
    envVars:
      - key: MYSQL_ROOT_PASSWORD
        generateValue: true
      - key: MYSQL_DATABASE
        value: techbuilding_db
      - key: MYSQL_USER
        value: tech_user
      - key: MYSQL_PASSWORD
        generateValue: true
      - key: MYSQL_ROOT_HOST
        value: "%"
    disk:
      name: techbuilding-mysql-data
      mountPath: /var/lib/mysql
      sizeGB: 10

  # OTPs, refresh tokens and short-lived sessions are stored here.
  - type: keyvalue
    name: techbuilding-redis
    plan: free
    region: singapore

  # MinIO is public because the application returns object URLs for browser
  # previews/downloads. The bucket policy is managed by the backend.
  - type: web
    name: techbuilding-minio
    runtime: image
    image:
      url: minio/minio:latest
    plan: starter
    region: singapore
    healthCheckPath: /minio/health/live
    envVars:
      - key: PORT
        value: "9000"
      - key: MINIO_ROOT_USER
        value: techbuilding
      - key: MINIO_ROOT_PASSWORD
        generateValue: true
    dockerCommand: server /data --address ":9000" --console-address ":9001"
    disk:
      name: techbuilding-minio-data
      mountPath: /data
      sizeGB: 10

  # Public API. Render builds the existing multi-stage Dockerfile.
  - type: web
    name: techbuilding-api
    runtime: docker
    plan: starter
    region: singapore
    rootDir: Backend/demoTechBuildding
    dockerfilePath: Dockerfile
    dockerContext: .
    healthCheckPath: /v3/api-docs
    envVars:
      - key: APP_DEMO_AUTO_FILL_OTP
        value: "true"
      - key: MYSQL_HOST
        fromService:
          name: techbuilding-mysql
          type: pserv
          property: host
      - key: MYSQL_PORT
        value: "3306"
      - key: MYSQL_DATABASE
        fromService:
          name: techbuilding-mysql
          type: pserv
          envVarKey: MYSQL_DATABASE
      - key: MYSQL_USER
        fromService:
          name: techbuilding-mysql
          type: pserv
          envVarKey: MYSQL_USER
      - key: MYSQL_PASSWORD
        fromService:
          name: techbuilding-mysql
          type: pserv
          envVarKey: MYSQL_PASSWORD
      - key: REDIS_HOST
        fromService:
          name: techbuilding-redis
          type: keyvalue
          property: host
      - key: REDIS_PORT
        fromService:
          name: techbuilding-redis
          type: keyvalue
          property: port
      - key: MINIO_ENDPOINT
        fromService:
          name: techbuilding-minio
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: MINIO_ROOT_USER
        fromService:
          name: techbuilding-minio
          type: web
          envVarKey: MINIO_ROOT_USER
      - key: MINIO_ROOT_PASSWORD
        fromService:
          name: techbuilding-minio
          type: web
          envVarKey: MINIO_ROOT_PASSWORD
      - key: MINIO_BUCKET_NAME
        value: techbuilding-storage
      - key: CORS_ALLOWED_ORIGINS
        fromService:
          name: techbuilding-frontend
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: OPENAPI_SERVER_URL
        fromService:
          name: techbuilding-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: JWT_ACCESS_KEY
        generateValue: true
      - key: JWT_REFRESH_KEY
        generateValue: true
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false

  # React/Vite frontend. Its API URL is automatically connected to the API
  # service, and its rewrite keeps React Router URLs working after refresh.
  - type: web
    name: techbuilding-frontend
    runtime: static
    rootDir: Frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          name: techbuilding-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_BASE_PATH
        value: /
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
