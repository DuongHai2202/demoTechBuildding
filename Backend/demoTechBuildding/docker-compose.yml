services:
  # MYSQL
  mysql_db:
    image: mysql:8.0.35
    container_name: techbuilding_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3308:3306"
    volumes:
      - ./mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 5

  # REDIS
  redis_cache:
    image: redis:latest
    container_name: techbuilding_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - ./redis_data:/data
    command: redis-server --appendonly yes

  # MINIO (Object Storage)
  minio_storage:
    image: minio/minio:latest
    container_name: techbuilding_minio
    restart: always
    ports:
      - "9090:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-admin123}
    volumes:
      - ./minio_data:/data
    command: server /data --console-address ":9001"

# Để khởi động: Mở Terminal ở thư mục này và gõ `docker-compose up -d`
# Để tắt: `docker-compose down`
