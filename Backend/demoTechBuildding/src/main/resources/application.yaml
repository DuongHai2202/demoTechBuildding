server:
  # Render injects PORT at runtime. Keep 8080 for local Docker/IDE runs.
  port: ${PORT:8080}
  forward-headers-strategy: framework

# Local demo helpers. Set APP_DEMO_AUTO_FILL_OTP=false in production; the
# email delivery and Redis verification flow remains enabled in both modes.
app:
  demo:
    auto-fill-otp: ${APP_DEMO_AUTO_FILL_OTP:true}
  auth:
    otp-expiry-minutes: ${OTP_EXPIRY_MINUTES:5}
  cors:
    allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}"

# Attendance integrity: an open planned shift is automatically finalized as
# ABSENT shortly after its scheduled end when no checkout was recorded.
attendance:
  auto-finalize-fixed-delay-ms: ${ATTENDANCE_AUTO_FINALIZE_DELAY_MS:60000}
  auto-finalize-initial-delay-ms: ${ATTENDANCE_AUTO_FINALIZE_INITIAL_DELAY_MS:60000}

spring:
  application:
    name: techbuilding-backend
  
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3308}/${MYSQL_DATABASE:techbuilding_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_0900_ai_ci
    username: ${MYSQL_USER:tech_user}
    password: ${MYSQL_PASSWORD:tech_password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate # Flyway quản lý DDL, Hibernate chỉ validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 250MB
      max-request-size: 250MB

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    from: ${MAIL_FROM:${spring.mail.username}}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            trust: smtp.gmail.com
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000


  # Redis Configuration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 5000

# MinIO Object Storage Configuration
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9090}
  access-key: ${MINIO_ROOT_USER:admin}
  secret-key: ${MINIO_ROOT_PASSWORD:admin123}
  bucket-name: ${MINIO_BUCKET_NAME:techbuilding-storage}

# JWT Configuration
jwt:
  accessKey: ${JWT_ACCESS_KEY:dGVjaGJ1aWxkaW5nLWFjY2Vzcy1rZXktc2VjcmV0LWJhc2U2NC1lbmNvZGVkLXZhbHVl}
  refreshKey: ${JWT_REFRESH_KEY:dGVjaGJ1aWxkaW5nLXJlZnJlc2gta2V5LXNlY3JldC1iYXNlNjQtZW5jb2RlZC12YWx1ZQ==}
  expiryMinutes: 1440 # Access token: 24 hours (1440 minutes)
  expiryDay: 7 # Refresh token: 7 days

# Swagger/OpenAPI Configuration
openapi:
  service:
    title: TechBuilding API
    version: 1.0.0
    description: API quản lý thi công xây dựng - TechBuilding Backend
    serverUrl: ${OPENAPI_SERVER_URL:http://localhost:8080}
    api-docs: techbuilding-service
