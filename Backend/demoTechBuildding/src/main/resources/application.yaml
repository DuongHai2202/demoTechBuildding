server:
  port: 8080

spring:
  application:
    name: techbuilding-backend
  
  datasource:
    url: jdbc:mysql://localhost:3308/${MYSQL_DATABASE:techbuilding_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:tech_user}
    password: ${MYSQL_PASSWORD:tech_password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate # Flyway quản lý DDL, Hibernate chỉ validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 250MB
      max-request-size: 250MB

  mail:
    host: smtp.gmail.com
    port: 465
    username: ${MAIL_USERNAME:duongvanhai2202@gmail.com}
    password: ${MAIL_PASSWORD:itlmkflryiovihas}
    from: duongvanhai2202@gmail.com
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          # starttls:
          #   enable: true # Port 465 uses SSL, not STARTTLS

  # Redis Configuration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 5000

# MinIO Object Storage Configuration
minio:
  endpoint: http://localhost:9090
  access-key: ${MINIO_ROOT_USER:admin}
  secret-key: ${MINIO_ROOT_PASSWORD:admin123}
  bucket-name: techbuilding-storage

# JWT Configuration
jwt:
  accessKey: ${JWT_ACCESS_KEY:dGVjaGJ1aWxkaW5nLWFjY2Vzcy1rZXktc2VjcmV0LWJhc2U2NC1lbmNvZGVkLXZhbHVl}
  refreshKey: ${JWT_REFRESH_KEY:dGVjaGJ1aWxkaW5nLXJlZnJlc2gta2V5LXNlY3JldC1iYXNlNjQtZW5jb2RlZC12YWx1ZQ==}
  expiryMinutes: 1440 # Access token: 24 hours (1440 minutes)
  expiryDay: 7 # Refresh token: 7 days

# Swagger/OpenAPI Configuration
openapi:
  service:
    title: TechBuilding API
    version: 1.0.0
    description: API quản lý thi công xây dựng - TechBuilding Backend
    serverUrl: http://localhost:8080
    api-docs: techbuilding-service
